<!-- viewBox is 4:3 with even margins on purpose: the Process visual is an
     aspect-4/3 box using object-cover, and at the drawing's native 1.6:1 the
     browser cropped ~133px off each side, taking the left dimension string
     with it. Drawing coordinates are unchanged. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-88 -104 1680 1260" width="1680" height="1260" role="img" aria-label="Light measured 2D floor plan drawing">
  <defs>
    <pattern id="lgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0B1624" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="poche" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v8" stroke="#0B1624" stroke-opacity="0.28" stroke-width="2.5"/>
    </pattern>
  </defs>

  <!-- drafting sheet — must cover the whole viewBox, or the widened margins
       fall through to the navy media box behind the image -->
  <rect x="-88" y="-104" width="1680" height="1260" fill="#FFFFFF"/>
  <rect x="-88" y="-104" width="1680" height="1260" fill="url(#lgrid)"/>

  <!-- ===== WALLS ===== -->
  <g stroke="#0B1624" fill="none" stroke-linecap="square">
    <!-- exterior shell, segmented to leave window + door openings -->
    <g stroke-width="13">
      <path d="M140 180h260"/><path d="M520 180h300"/><path d="M940 180h520"/>
      <path d="M1460 180v220"/><path d="M1460 520v300"/>
      <path d="M1460 820h-360"/><path d="M980 820H640"/><path d="M520 820H140"/>
      <path d="M140 820V600"/><path d="M140 480V180"/>
    </g>
    <!-- interior partitions -->
    <g stroke-width="8">
      <path d="M820 180v220"/><path d="M820 500v320"/>
      <path d="M140 520h240"/><path d="M480 520h340"/>
      <path d="M820 470h280"/><path d="M1200 470h260"/>
      <path d="M1200 650v170"/><path d="M1200 650h260"/>
    </g>
  </g>

  <!-- wall poché on the exterior shell, so it reads as built fabric -->
  <g fill="url(#poche)" stroke="none" opacity="0.9">
    <rect x="134" y="174" width="1332" height="13"/>
    <rect x="134" y="813" width="1332" height="13"/>
  </g>

  <!-- ===== WINDOWS ===== -->
  <g stroke="#1677FF" stroke-width="4" fill="none">
    <path d="M400 180h120"/><path d="M820 180h120"/>
    <path d="M1460 400v120"/>
    <path d="M980 820h120"/><path d="M520 820h120"/>
    <path d="M140 480v120"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.4" fill="none">
    <path d="M400 180h120"/><path d="M820 180h120"/>
    <path d="M1460 400v120"/>
    <path d="M980 820h120"/><path d="M520 820h120"/>
    <path d="M140 480v120"/>
  </g>

  <!-- ===== DOOR SWINGS ===== -->
  <g stroke="#6B7A8F" stroke-width="2.2" fill="none">
    <path d="M380 520h100"/>
    <path d="M380 520a100 100 0 0 1 100 100" stroke-dasharray="6 5"/>
    <path d="M820 400v100"/>
    <path d="M820 400a100 100 0 0 0 100 100" stroke-dasharray="6 5"/>
    <path d="M1100 470h100"/>
    <path d="M1100 470a100 100 0 0 1 100 100" stroke-dasharray="6 5"/>
  </g>

  <!-- ===== FURNITURE ===== -->
  <g stroke="#8A97A8" stroke-width="2.2" fill="none">
    <!-- kitchen run + island -->
    <path d="M162 202h300v72H162z"/><path d="M162 274v170h72V274"/>
    <circle cx="232" cy="238" r="20"/><circle cx="312" cy="238" r="20"/>
    <rect x="300" y="320" width="200" height="86"/>
    <!-- dining -->
    <circle cx="660" cy="330" r="76"/><circle cx="660" cy="330" r="6" fill="#8A97A8"/>
    <!-- living -->
    <path d="M200 700h300v78H200z"/><path d="M200 700v-32h300v32"/>
    <rect x="250" y="580" width="200" height="20"/>
    <rect x="215" y="600" width="285" height="130" stroke-dasharray="7 6"/>
    <!-- principal bed -->
    <rect x="960" y="222" width="220" height="240"/><path d="M960 288h220"/>
    <rect x="916" y="222" width="36" height="50"/><rect x="1188" y="222" width="36" height="50"/>
    <!-- second bed -->
    <rect x="880" y="560" width="190" height="130"/><path d="M942 560v130"/>
    <!-- bath -->
    <rect x="1250" y="690" width="88" height="112" rx="8"/>
    <circle cx="1400" cy="720" r="26"/><rect x="1356" y="762" width="88" height="36"/>
  </g>

  <!-- ===== ROOM LABELS ===== -->
  <g font-family="ui-monospace, monospace" font-size="19" letter-spacing="3.6" fill="#0B1624">
    <text x="400" y="482">KITCHEN / DINING</text>
    <text x="290" y="672">LIVING ROOM</text>
    <text x="960" y="522">PRINCIPAL BEDROOM</text>
    <text x="880" y="742">BEDROOM 02</text>
    <text x="1258" y="620">BATH</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="14" letter-spacing="2.4" fill="#6B7A8F">
    <text x="400" y="508">28.4 M²</text>
    <text x="290" y="698">31.2 M²</text>
    <text x="960" y="548">24.0 M²</text>
    <text x="880" y="768">16.8 M²</text>
    <text x="1258" y="644">6.2 M²</text>
  </g>

  <!-- ===== DIMENSION STRINGS ===== -->
  <g stroke="#1677FF" stroke-width="1.4" fill="none">
    <path d="M140 900h1320"/>
    <path d="M140 888v24M820 888v24M1460 888v24"/>
    <path d="M84 180v640"/>
    <path d="M72 180h24M72 520h24M72 820h24"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="15" letter-spacing="2.2" fill="#1677FF">
    <text x="480" y="930" text-anchor="middle">10 400</text>
    <text x="1140" y="930" text-anchor="middle">10 200</text>
    <text x="52" y="350" text-anchor="middle" transform="rotate(-90 52 350)">6 600</text>
    <text x="52" y="670" text-anchor="middle" transform="rotate(-90 52 670)">6 200</text>
  </g>

  <!-- ===== TITLE BLOCK ===== -->
  <g font-family="ui-monospace, monospace" letter-spacing="3.2" fill="#6B7A8F" font-size="14">
    <path d="M140 110h1320" stroke="#0B1624" stroke-opacity="0.15" stroke-width="1"/>
    <text x="140" y="92" fill="#0B1624" font-size="17">LEVEL 02 — RESIDENTIAL UNIT B</text>
    <text x="1460" y="92" text-anchor="end">SCALE 1:100</text>
    <text x="140" y="975">DRAWING 2D-104</text>
    <text x="1460" y="975" text-anchor="end">FLOOR STUDIO</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(1400 140)" stroke="#0B1624" stroke-opacity="0.5" fill="none" stroke-width="1.6">
    <circle r="19"/><path d="M0 -14v28"/>
    <path d="M0 -14l6 9h-12z" fill="#1677FF" stroke="none"/>
  </g>
</svg>
