<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Architectural drawing backdrop">
  <defs>
    <radialGradient id="vig" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#0D1620"/>
      <stop offset="60%" stop-color="#080C12"/>
      <stop offset="100%" stop-color="#05070A"/>
    </radialGradient>
    <pattern id="fine" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#F5F7FA" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="coarse" width="150" height="150" patternUnits="userSpaceOnUse">
      <path d="M150 0H0V150" fill="none" stroke="#F5F7FA" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#vig)"/>
  <rect width="1920" height="1080" fill="url(#fine)"/>
  <rect width="1920" height="1080" fill="url(#coarse)"/>

  <!-- oversized plan fragment, drifting off-canvas like a drafting sheet -->
  <g transform="translate(560 150) scale(1.15)" opacity="0.5">
    <g stroke="#C7D3E2" stroke-opacity="0.5" fill="none" stroke-linecap="square">
      <g stroke-width="9">
        <path d="M0 0h300"/><path d="M420 0h340"/>
        <path d="M760 0v210"/><path d="M760 330v300"/>
        <path d="M760 630H430"/><path d="M310 630H0"/>
        <path d="M0 630V400"/><path d="M0 280V0"/>
      </g>
      <g stroke-width="5">
        <path d="M400 0v180"/><path d="M400 300v330"/>
        <path d="M0 330h150"/><path d="M270 330h130"/>
        <path d="M400 360h150"/><path d="M670 360h90"/>
      </g>
    </g>
    <g stroke="#2F8FFF" stroke-opacity="0.8" stroke-width="3" fill="none">
      <path d="M300 0h120"/><path d="M760 210v120"/><path d="M310 630h120"/><path d="M0 280v120"/>
    </g>
    <g stroke="#8C97A8" stroke-opacity="0.55" stroke-width="1.6" fill="none">
      <path d="M150 330a120 120 0 0 1 120 120"/>
      <path d="M550 360a120 120 0 0 0 120 120" />
      <rect x="60" y="60" width="230" height="90"/>
      <circle cx="560" cy="150" r="70"/>
      <rect x="90" y="440" width="200" height="120"/>
      <rect x="480" y="440" width="180" height="140"/>
    </g>
  </g>

  <!-- dimension string -->
  <g stroke="#2F8FFF" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M560 900h880"/>
    <path d="M560 888v24M1000 888v24M1440 888v24"/>
  </g>

  <!-- corner registration marks -->
  <g stroke="#F5F7FA" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M80 80h60M80 80v60"/>
    <path d="M1840 80h-60M1840 80v60"/>
    <path d="M80 1000h60M80 1000v-60"/>
    <path d="M1840 1000h-60M1840 1000v-60"/>
  </g>

  <!-- bottom fade so headline copy always sits on a dark base -->
  <rect y="620" width="1920" height="460" fill="#05070A" opacity="0.55"/>
</svg>
