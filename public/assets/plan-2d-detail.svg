<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-label="Architectural floor plan detail with dimension annotations">
  <defs>
    <pattern id="gd" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#F5F7FA" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="1100" fill="#0A0F16"/>
  <rect width="900" height="1100" fill="url(#gd)"/>

  <!-- enlarged wall junction detail -->
  <g stroke="#E8EEF7" fill="none" stroke-linecap="square">
    <g stroke-width="14">
      <path d="M120 180h250"/><path d="M470 180h310"/>
      <path d="M780 180v240"/><path d="M780 540v320"/>
      <path d="M780 860H520"/><path d="M420 860H120"/>
      <path d="M120 860V620"/><path d="M120 480V180"/>
    </g>
    <g stroke-width="8">
      <path d="M450 180v210"/><path d="M450 510v350"/>
      <path d="M120 520h130"/><path d="M350 520h100"/>
    </g>
  </g>

  <!-- window + opening accents -->
  <g stroke="#2F8FFF" stroke-width="3.5" fill="none">
    <path d="M370 180h100"/><path d="M780 420v120"/><path d="M420 860h100"/><path d="M120 480v140"/>
  </g>

  <!-- door swing -->
  <g stroke="#8C97A8" stroke-width="2" fill="none">
    <path d="M250 520h100"/>
    <path d="M250 520a100 100 0 0 1 100 100" stroke-dasharray="5 5"/>
    <path d="M450 390v120"/>
    <path d="M450 390a120 120 0 0 0 120 120" stroke-dasharray="5 5"/>
  </g>

  <!-- hatch on one wall to show assembly -->
  <g stroke="#2F8FFF" stroke-opacity="0.55" stroke-width="1.2">
    <path d="M124 190l-0 0M126 186l10 10M136 186l10 10M146 186l10 10M156 186l10 10M166 186l10 10M176 186l10 10M186 186l10 10M196 186l10 10M206 186l10 10M216 186l10 10M226 186l10 10M236 186l10 10M246 186l10 10M256 186l10 10M266 186l10 10M276 186l10 10M286 186l10 10M296 186l10 10M306 186l10 10M316 186l10 10M326 186l10 10M336 186l10 10M346 186l10 10M356 186l10 10"/>
  </g>

  <!-- furniture -->
  <g stroke="#6E7A8C" stroke-width="2" fill="none">
    <rect x="150" y="210" width="260" height="70"/>
    <circle cx="620" cy="300" r="62"/>
    <rect x="170" y="640" width="220" height="80"/>
    <rect x="520" y="600" width="200" height="180"/>
    <path d="M520 660h200"/>
  </g>

  <!-- dimension strings -->
  <g stroke="#2F8FFF" stroke-width="1.25" fill="none" stroke-opacity="0.9">
    <path d="M120 940h660"/>
    <path d="M120 928v24M450 928v24M780 928v24"/>
    <path d="M70 180v680"/>
    <path d="M58 180h24M58 520h24M58 860h24"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="14" letter-spacing="2.4" fill="#2F8FFF">
    <text x="285" y="972" text-anchor="middle">3 300</text>
    <text x="615" y="972" text-anchor="middle">3 300</text>
    <text x="42" y="350" text-anchor="middle" transform="rotate(-90 42 350)">3 400</text>
    <text x="42" y="690" text-anchor="middle" transform="rotate(-90 42 690)">3 400</text>
  </g>

  <!-- callout -->
  <g stroke="#F5F7FA" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <circle cx="450" cy="520" r="66"/>
    <path d="M497 473l90-90"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="14" letter-spacing="2.6" fill="#F5F7FA">
    <text x="596" y="378">DETAIL A</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="13" letter-spacing="2.4" fill="#8C97A8">
    <text x="596" y="402">WALL JUNCTION 1:20</text>
  </g>

  <!-- title block -->
  <g font-family="ui-monospace, monospace" letter-spacing="3" fill="#8C97A8" font-size="13">
    <path d="M120 110h660" stroke="#F5F7FA" stroke-opacity="0.12" stroke-width="1"/>
    <text x="120" y="94" fill="#F5F7FA" font-size="15">PLAN DETAIL — SHEET A-212</text>
    <text x="780" y="94" text-anchor="end">1:50</text>
    <text x="120" y="1050">ISSUED FOR REVIEW</text>
    <text x="780" y="1050" text-anchor="end">FLOOR STUDIO</text>
  </g>
</svg>
